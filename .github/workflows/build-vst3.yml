name: build-vst3

on:
  push:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC, Release, SDK via FetchContent)
        run: cmake -B build -S PrecisionPitchShift -DPPS_VST3_SDK_TAG="v3.7.14_build_55"

      - name: Build plugin + tests
        run: cmake --build build --config Release

      - name: Run DSP tests
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Locate .vst3 bundle
        id: findvst3
        shell: pwsh
        run: |
          Write-Host "--- searching build tree ---"
          Get-ChildItem -Recurse build -Filter "*vst3*" | Select-Object FullName
          $bundle = Get-ChildItem -Recurse build -Filter "PrecisionPitchShift.vst3" | Select-Object -First 1
          if (-not $bundle) {
            Write-Host "--- searching default VST3 install dir ---"
            $sys = Join-Path $env:ProgramFiles "Common Files\VST3"
            if (Test-Path $sys) {
              Get-ChildItem -Recurse $sys -Filter "*PrecisionPitch*" | Select-Object FullName
              $bundle = Get-ChildItem -Recurse $sys -Filter "PrecisionPitchShift.vst3" | Select-Object -First 1
            }
          }
          if (-not $bundle) { Write-Error "bundle .vst3 not found"; exit 1 }
          echo "path=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
